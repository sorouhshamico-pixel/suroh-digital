name: PHP Quality Check
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint PHP
        run: find app config public resources routes database -name '*.php' -print0 | xargs -0 -n1 php -l
